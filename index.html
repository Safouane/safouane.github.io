<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperDuck: Sky Boss Battles</title>
<meta name="description" content="SuperDuck: Sky Boss Battles, a one-tap flying game for Android.">
<style>
  :root { --bg: #EAF3FE; --card: #fff; --ink: #16213A; --muted: #5B6884; --sky: #2368D6; --duck: #FFC93A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1527; --card: #16203A; --ink: #E7EDF8; --muted: #9AA8C4; --sky: #7DB0FF; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { background: var(--card); border-radius: 24px; padding: 32px 28px; max-width: 480px; width: 100%; text-align: center;
         box-shadow: 0 10px 30px rgba(22, 33, 58, .12); }
  h1 { margin: 12px 0 4px; font-size: 1.7rem; line-height: 1.15; }
  p { margin: 0 0 18px; color: var(--muted); }
  .play { display: inline-block; background: var(--sky); color: #fff; text-decoration: none; font-weight: 700;
          padding: 12px 22px; border-radius: 14px; }
  nav { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: .95rem; }
  nav a { color: var(--sky); }
</style>
</head>
<body>
<main>
  <svg width="96" height="96" viewBox="0 0 52 52" aria-hidden="true">
    <rect width="52" height="52" rx="14" fill="#2F86EA"/>
    <circle cx="26" cy="30" r="13" fill="#FFC93A"/>
    <ellipse cx="25" cy="17.5" rx="13" ry="7.5" fill="#6B4A2E"/>
    <circle cx="21" cy="18" r="4" fill="#FFCB3D"/><circle cx="30" cy="18" r="4" fill="#FFCB3D"/>
    <circle cx="21" cy="18" r="2.6" fill="#2B6FA8"/><circle cx="30" cy="18" r="2.6" fill="#2B6FA8"/>
    <circle cx="31" cy="29" r="3.2" fill="#fff"/><circle cx="32" cy="29.4" r="1.7" fill="#16213A"/>
    <ellipse cx="38.5" cy="35" rx="6" ry="2.8" fill="#FF7A2E"/>
  </svg>
  <h1>SuperDuck: Sky Boss Battles</h1>
  <p>Tap to fly, dodge predators, suit up with missiles and beat four epic bosses.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.safouane.superduck">Get it on Google Play</a>
  <nav>
    <a href="/superduck-privacy/">Privacy policy</a>
    <span>Support: s1prodsmail@gmail.com</span>
  </nav>
</main>
</body>
</html>
